name: TruthLens regression checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install streamlit requests reportlab pillow pandas
      - name: Compile application and modules
        run: python -m compileall -q app.py modules tests
      - name: Run consolidated regression suite
        run: python -m unittest discover -s tests -v
